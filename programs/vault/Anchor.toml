[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
tenfold_vault = "ZeuPBsa2uZjspXRs3VgqjTtaBwW9CU6ZPyVzeyrZTNo"

[programs.devnet]
tenfold_vault = "ZeuPBsa2uZjspXRs3VgqjTtaBwW9CU6ZPyVzeyrZTNo"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Plain `anchor test`: the suite runs against a production-flag build, so the
# time-dependent cases (window reset, 48h cap raise, withdrawal delay, 7 day
# admin timelock) and the Memo-based swap cases are skipped and say so.
#
# Full suite (every "day" is 10 s and Memo is accepted as a no-op venue):
#   TENFOLD_TEST_CLOCK=1 anchor test -- --features testing
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000
